<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Inteligente</title>
 <style>
/* Fondo general de la página */
body{
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Caja principal del chatbot */
#chatbot{
    width: 420px;
    height: 600px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Título */
#chatbot h2{
    margin: 0;
    padding: 18px;
    text-align: center;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    color: white;
    font-size: 24px;
}

/* Zona de mensajes */
#messages{
    flex-grow: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f5f7fa;
}

/* Estilo general mensajes */
.msg{
    max-width: 75%;
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 15px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
}

/* Mensaje usuario */
.user{
    background: #4facfe;
    color: white;
    margin-left: auto;
    text-align: right;
    border-bottom-right-radius: 5px;
}

/* Mensaje bot */
.bot{
    background: #e4e6eb;
    color: #333;
    margin-right: auto;
    text-align: left;
    border-bottom-left-radius: 5px;
}

/* Formulario abajo */
#chatForm{
    display: flex;
    padding: 12px;
    border-top: 1px solid #ddd;
    background: white;
}

/* Caja de texto */
#userInput{
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
}

/* Botón enviar */
button{
    margin-left: 10px;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    background: #4facfe;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
}

/* Hover botón */
button:hover{
    background: #008cff;
}
</style>
</head>
<body>
<div id="chatbot">
    <h2>🤖 ChatBot</h2>

    <div id="messages"></div>

    <form id="chatForm">
        <input 
            type="text" 
            id="userInput" 
            placeholder="Escribe tu mensaje..." 
            autocomplete="off"
        >
        <button type="submit">Enviar</button>
    </form>
</div>

<script>

const form = document.getElementById("chatForm"); // Captura el formulario HTML con id="chatForm"
const input = document.getElementById("userInput");// Captura el campo de texto donde el usuario escribe mensajes
const messages = document.getElementById("messages"); // Captura el contenedor donde se mostrarán los mensajes del chat
form.addEventListener("submit", async (e) => { // Escucha el evento "submit" cuando el usuario envía el formulario
        e.preventDefault();// Evita que la página se recargue al enviar el formulario
        const text = input.value.trim(); // Guarda el texto escrito y elimina espacios al inicio y final
        if (!text) return;// Si el campo está vacío, no hace nada
        messages.innerHTML += `<div class="msg user">Tú: ${text}</div>`; // Agrega el mensaje del usuario dentro del contenedor del chat
        input.value = ""; // Limpia el campo de texto después de enviar el mensaje

       const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `message=${encodeURIComponent(text)}`
});
const data = await response.json();
messages.innerHTML += `<div class="msg bot">Bot: ${data.response}</div>`;
messages.scrollTop = messages.scrollHeight;

});
 
</script> 
   
</body>
</html>
